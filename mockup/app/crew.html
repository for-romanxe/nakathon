<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승무원 · Crew Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
(function(){
const {S,CREW,me,MK,META,lvl,z,fmt,sig,crewLevel,levelEn,levelName,openEvents,shell,toast,save,addLog,esc,mountBody,hhmm,SOL,daily,streak}=CH;
const v=me();const root=shell('crew','승무원');
if(!v.cmo){root.innerHTML=`<div class="empty" style="padding:80px 24px"><b>의료 담당(CMO) 전용 화면</b>${v.name}은(는) 본인 데이터만 볼 수 있습니다. 열람 권한은 설정에서 CMO가 바꿉니다.<div style="margin-top:16px"><a class="btn" href="settings.html">설정 · 데모 전환</a></div></div>`;return;}
function render(){
  const ids=Object.keys(CREW);
  root.innerHTML=`<div class="grid" style="grid-template-columns:repeat(4,1fr)">${ids.map(id=>{const c=CREW[id];const L=crewLevel(c);const ev=openEvents(id);const off=MK.filter(k=>lvl(k,c)!=='normal'&&lvl(k,c)!=='hold');
    return `<div class="panel"><div class="hd"><span class="av badge" style="font-weight:600">${id}</span>${c.name}<div class="sp"></div><span class="badge ${L}">${levelEn(L)}</span></div>
      <div class="bd" style="height:170px"><div class="bodywrap" style="height:100%"><canvas data-c="${id}" aria-label="${c.name} 바디"></canvas></div></div>
      <div class="bd p0 hairrows" style="font-size:12px">
        <div class="row between"><span class="muted">역할</span><span>${c.role}</span></div>
        <div class="row between"><span class="muted">기준선</span><span class="mono">${c.baselineDays<14?`<span class="sig caution">${c.baselineDays}/14일</span>`:'14/14'}</span></div>
        <div class="row between"><span class="muted">동기화</span><span class="mono">${c.sync} · ${c.wear}</span></div>
        <div class="row between"><span class="muted">아침 체크인</span><span class="mono">${daily(id).am?'완료 '+daily(id).am.at:'대기'} · ${streak(c)}일 연속</span></div>
        <div class="row between"><span class="muted">벗어난 지표</span><span>${off.length?off.map(k=>`<span class="sig ${lvl(k,c)}">${META[k].l} ${sig(z(k,c))}</span>`).join(' · '):c.baselineDays<14?'판정 전':'없음'}</span></div>
        <div class="row between"><span class="muted">열린 이벤트</span><span>${ev.length?ev.map(e=>`<a class="cite" href="event.html?id=${e.id}">${e.id}</a>`).join(' '):'0'}</span></div>
      </div>
      <div class="bd row" style="gap:8px">${ev[0]?`<a class="btn sm p" href="event.html?id=${ev[0].id}">상세</a>`:''}<a class="btn sm" href="trends.html?crew=${id}">추세</a></div></div>`;}).join('')}</div>
  <div class="grid g-main" style="margin-top:16px">
    <div class="panel"><div class="hd">지구 전송 큐<div class="sp"></div><small>다음 창 ${S.settings.txTime} · 편도 지연 12분</small><button class="btn sm" id="txDaily">일일 요약 추가</button></div><div class="bd p0"><table><thead><tr><th>패킷</th><th>대상</th><th>종류</th><th>상태</th><th class="num">시각</th></tr></thead><tbody>
      ${S.tx.map(t=>`<tr><td class="mono" style="font-size:11.5px">${t.id}</td><td>${t.crew==='ALL'?'전원':CREW[t.crew].name}</td><td>${esc(t.kind)}</td><td><span class="badge ${t.status==='전송됨'?'normal':t.status==='긴급'?'warning':''}">${t.status}</span>${t.ack?`<span class="note" style="margin-left:6px">${t.ack}</span>`:''}</td><td class="num muted">Sol ${t.sol} ${t.time}</td></tr>`).join('')}
    </tbody></table></div><div class="bd row" style="gap:8px"><button class="btn p" id="txSend" ${S.tx.some(t=>t.status==='대기'||t.status==='긴급')?'':'disabled'}>지금 전송 (창 밖 · 사유 기록)</button><span class="note">긴급 패킷은 창과 무관하게 즉시 보냅니다. 응답은 왕복 24분 뒤부터.</span></div></div>
    <div class="stack">
      <div class="panel"><div class="hd">무시 기록<div class="sp"></div><small>${S.overrides.length}</small></div><div class="bd p0 hairrows" style="font-size:12px">${S.overrides.map(o=>`<div><a class="cite" href="event.html?id=${o.eventId}">${o.eventId}</a> <span class="muted">Sol ${o.sol} ${o.time} · ${o.who}</span><div>${esc(o.reason)}${o.note?' · '+esc(o.note):''}</div></div>`).join('')||'<div class="empty" style="padding:18px">없음</div>'}</div></div>
      <div class="panel"><div class="hd">오늘 활동</div><div class="bd tl" style="padding-bottom:4px">${S.log.slice(0,7).map(l=>`<div><time>Sol ${l.sol} ${l.time} · ${l.who}</time>${esc(l.text)}</div>`).join('')}</div></div>
    </div>
  </div>`;
  document.querySelectorAll('canvas[data-c]').forEach(cv=>mountBody(cv,cv.dataset.c,{dense:true,onClick:()=>{const ev=openEvents(cv.dataset.c)[0];location.href=ev?'event.html?id='+ev.id:'trends.html?crew='+cv.dataset.c;}}));
  document.getElementById('txDaily').onclick=()=>{S.tx.unshift({id:'tx-'+SOL+'-d',sol:SOL,time:hhmm(),crew:'ALL',kind:'일일 요약 · 4명',status:'대기'});save();addLog('지구 전송 큐 · 일일 요약 추가','B');render();};
  const ts=document.getElementById('txSend');if(ts)ts.onclick=()=>{S.tx.forEach(t=>{if(t.status==='대기'||t.status==='긴급'){t.status='전송됨';t.ack='수신 확인 대기 · +24분';}});save();addLog('지구 전송 실행 · 창 밖 · 사유: CMO 판단','B');toast('전송했습니다 · 수신 확인은 24분 뒤부터');render();};
}
render();
})();
</script>
</body>
</html>
